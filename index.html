    const gistRead = async (gistId, token) => {
      const r = await fetch(`https://api.github.com/gists/${gistId}`, {
        headers: { Authorization: `token ${token}`, Accept: "application/vnd.github+json" }
      });
      if (!r.ok) throw new Error(`GitHub API ${r.status}`);
      const data = await r.json();
      const content = data.files[FILENAME]?.content;
      return content ? JSON.parse(content) : {};
    };
    const gistWrite = async (gistId, token, obj) => {
      const r = await fetch(`https://api.github.com/gists/${gistId}`, {
        method: "PATCH",
        headers: { Authorization: `token ${token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
        body: JSON.stringify({ files: { [FILENAME]: { content: JSON.stringify(obj) } } })
      });
      if (!r.ok) throw new Error(`GitHub API ${r.status}`);
    };

    /* ── Training plan ── */
    function TrainingPlan({ config, onReset }) {
      const [activeWeek,setActiveWeek]=useState(1);
      const [done,setDone]=useState({});
      const [syncStatus,setSyncStatus]=useState("loading");
      const [lastSynced,setLastSynced]=useState(null);
      const debounceRef=useRef(null);

      useEffect(()=>{
        (async()=>{
          try {
            const remote=await gistRead(config.gistId,config.token);
            const merged={...loadLocal(),...remote};
            setDone(merged); saveLocal(merged);
            setSyncStatus("synced"); setLastSynced(new Date());
          } catch(_){ setDone(loadLocal()); setSyncStatus("error"); }
        })();
      },[]);

      const syncToGist=useCallback(obj=>{
        clearTimeout(debounceRef.current); setSyncStatus("syncing");
        debounceRef.current=setTimeout(async()=>{
          try { await gistWrite(config.gistId,config.token,obj); setSyncStatus("synced"); setLastSynced(new Date()); }
          catch(_){ setSyncStatus("error"); }
        },1200);
      },[config]);

      const toggle=(wn,di)=>{
        const k=`${wn}-${di}`;
        const next={...done,[k]:!done[k]};
        Object.keys(next).forEach(k=>{if(!next[k])delete next[k];});
        setDone(next); saveLocal(next); syncToGist(next);
      };
      const isDone=(wn,di)=>!!done[`${wn}-${di}`];
      const weekProg=wn=>{
        const w=weeks[wn-1];
        const ch=w.workouts.filter(d=>CHECKABLE.includes(d.type));
        return{total:ch.length,done:ch.filter(d=>isDone(wn,w.workouts.indexOf(d))).length};
      };

      const week=weeks[activeWeek-1];
      const phase=getPhase(activeWeek);
      const race=new Date("2027-02-28");
      const days=Math.max(0,Math.ceil((race-new Date())/864e5));
      const {total:wTotal,done:wDone}=weekProg(activeWeek);
      const totalDone=Object.values(done).filter(Boolean).length;
      const skiMin=week.workouts.reduce((s,w)=>w.type==="skierg"?s+w.min:s,0);
      const skiKm=week.workouts.reduce((s,w)=>w.type==="skiing"?s+w.km:s,0);
      const runKm=week.workouts.reduce((s,w)=>["easy","long"].includes(w.type)?s+w.km:s,0);
      const cycMin=week.workouts.reduce((s,w)=>["cycling","cycleint"].includes(w.type)?s+w.min:s,0);
      const syncColor={loading:"#94a3b8",synced:"#22c55e",syncing:"#f59e0b",error:"#ef4444"}[syncStatus];
      const syncLabel={loading:"Laddas...",synced:lastSynced?`Synkad ${lastSynced.toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"})}`:"Synkad",syncing:"Sparar...",error:"Synkfel"}[syncStatus];

      return (
        <div style={{fontFamily:"'Inter',system-ui,sans-serif",background:"#e8eef5",minHeight:"100vh",color:"#1e293b"}}>
          <div style={{background:"linear-gradient(135deg,#1b3a5c 0%,#254b73 60%,#1b4d6e 100%)",padding:"24px 24px 20px",color:"white"}}>
            <div style={{maxWidth:740,margin:"0 auto"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
                <div>
                  <div style={{fontSize:12,fontWeight:600,color:"#93c5fd",marginBottom:6}}>Träningsplan · 22 veckor</div>
                  <h1 style={{margin:0,fontSize:26,fontWeight:900,lineHeight:1.1,letterSpacing:"-0.02em"}}>Öppet Spår 90 km</h1>
                  <div style={{marginTop:7,fontSize:13,color:"#bae6fd",display:"flex",gap:10,flexWrap:"wrap"}}>
                    <span>28 februari 2027</span><span style={{opacity:.4}}>·</span><span>Mål: under 8 timmar</span>
                  </div>
                </div>
                <div style={{background:"rgba(255,255,255,.1)",borderRadius:14,padding:"10px 20px",textAlign:"center",border:"1px solid rgba(255,255,255,.15)"}}>
                  <div style={{fontSize:30,fontWeight:900,lineHeight:1}}>{days}</div>
                  <div style={{fontSize:11,color:"#93c5fd",fontWeight:600,marginTop:2}}>dagar kvar</div>
                </div>
              </div>
              <div style={{display:"flex",gap:5,marginTop:16,flexWrap:"wrap"}}>
                {[{e:"🚴",t:"Mån: Cykling"},{e:"💪",t:"Tis: Styrka ök."},{e:"🎿⚽",t:"Ons: Skierg+Fotboll"},{e:"🦵",t:"Tor: Styrka uk."},{e:"🏖️",t:"Fre: Ledig"},{e:"🏃⛷️",t:"Lör: Löpning/Skidor"},{e:"🟣",t:"Sön: Långpass"}]
                  .map(b=><div key={b.t} style={{background:"rgba(255,255,255,.12)",borderRadius:20,padding:"4px 11px",fontSize:11,fontWeight:600,color:"white"}}>{b.e} {b.t}</div>)}
              </div>
            </div>

          <div style={{background:"#0f172a",padding:"9px 20px"}}>
            <div style={{maxWidth:740,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>

                <div style={{width:8,height:8,borderRadius:"50%",background:syncColor,flexShrink:0}}/>
                <span style={{fontSize:12,color:"#94a3b8"}}>{syncLabel}</span>

                {weeks.map(w=>{
                  const ph=getPhase(w.week); const isActive=w.week===activeWeek;

                  const allDone=prog.total>0&&prog.done===prog.total;
                  const partial=prog.done>0&&!allDone;
                  return(
                    <button key={w.week} onClick={()=>setActiveWeek(w.week)} style={{border:"none",background:isActive?ph.color:"transparent",borderRadius:7,cursor:"pointer",padding:"5px 5px 4px",display:"flex",flexDirection:"column",alignItems:"center",gap:2,minWidth:38,position:"relative",outline:isActive?`2px solid ${ph.color}`:"none",outlineOffset:1}}>

          <div style={{maxWidth:740,margin:"0 auto",padding:"14px"}}>
            <div style={{background:"white",borderRadius:12,padding:"16px 20px",marginBottom:12,borderLeft:`4px solid ${phase.color}`,boxShadow:"0 1px 3px rgba(0,0,0,.06)"}}>

                  <div style={{fontSize:11,fontWeight:700,color:phase.color,marginBottom:3}}>{phase.name} · Vecka {week.week} av 22</div>

                  <div style={{fontSize:13,fontWeight:600,color:"#475569",marginTop:3}}>{week.focus}</div>
                  {wDone>0&&<div style={{marginTop:4,fontSize:13,fontWeight:700,color:wDone===wTotal?"#22c55e":"#f59e0b"}}>{wDone===wTotal?"✅":"⏳"} {wDone}/{wTotal} pass klara</div>}
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:4,alignItems:"flex-end"}}>
                  {runKm>0&&<div style={{fontSize:12,color:TYPES.easy.color,fontWeight:700}}>🏃 {runKm} km</div>}

                </div>
              </div>
            </div>

            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:5,marginBottom:8}}>
              {week.workouts.map((w,i)=>{
                const t=TYPES[w.type]; const canCheck=CHECKABLE.includes(w.type); const checked=isDone(activeWeek,i);
                const hasContent=!["rest","off"].includes(w.type);
                return(
                  <div key={i} onClick={()=>canCheck&&toggle(activeWeek,i)} style={{background:checked?"#f0fdf4":(hasContent?t.bg:"#f8fafc"),borderRadius:10,padding:"10px 5px",border:checked?"1.5px solid #22c55e":`1.5px solid ${hasContent?t.color+"28":"#e2e8f0"}`,cursor:canCheck?"pointer":"default",position:"relative",transition:"all .15s",userSelect:"none"}}>
                    {checked&&<div style={{position:"absolute",top:4,right:4,width:14,height:14,borderRadius:"50%",background:"#22c55e",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:"white",fontWeight:900}}>✓</div>}
                    <div style={{fontSize:9,fontWeight:700,marginBottom:5,color:checked?"#16a34a":(hasContent?t.color:"#94a3b8")}}>{w.day.toUpperCase()}</div>
                    <div style={{fontSize:16,lineHeight:1}}>{t.emoji}</div>
                    {w.km>0&&w.type!=="race"&&<div style={{marginTop:3,fontSize:12,fontWeight:900,color:checked?"#16a34a":"#0f172a"}}>{w.km}<span style={{fontSize:8,color:"#94a3b8"}}>km</span></div>}
                    {w.type==="race"&&<div style={{marginTop:2,fontSize:9,fontWeight:800,color:"#dc2626"}}>90 km</div>}
                    {w.min>0&&w.km===0&&<div style={{marginTop:3,fontSize:11,fontWeight:800,color:checked?"#16a34a":"#0f172a"}}>{w.min}<span style={{fontSize:8,color:"#94a3b8"}}>m</span></div>}
                    {["strength","strengthU","strengthL","soccer","off","rest"].includes(w.type)&&w.km===0&&w.min===0&&<div style={{marginTop:3,fontSize:8,fontWeight:600,color:checked?"#16a34a":t.color}}>{w.type.startsWith("strength")?"styrka":w.type==="soccer"?"fotboll":w.type==="off"?"ledig":"—"}</div>}
                  </div>
                );
              })}
            </div>
            <div style={{fontSize:11,color:"#94a3b8",textAlign:"center",marginBottom:12}}>Tryck på ett pass för att bocka av det – sparas automatiskt</div>

            <div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:12}}>
              {week.workouts.map((w,i)=>{
                if(!w.desc||w.type==="off") return null;
                const t=TYPES[w.type]; const canCheck=CHECKABLE.includes(w.type); const checked=isDone(activeWeek,i);
                return(
                  <div key={i} onClick={()=>canCheck&&toggle(activeWeek,i)} style={{background:checked?"#f0fdf4":"white",borderRadius:10,padding:"12px 14px",display:"flex",gap:12,alignItems:"flex-start",boxShadow:"0 1px 2px rgba(0,0,0,.04)",cursor:canCheck?"pointer":"default",border:checked?"1px solid #bbf7d0":"1px solid transparent",transition:"all .15s",userSelect:"none"}}>
                    <div style={{width:36,height:36,borderRadius:8,background:checked?"#dcfce7":t.bg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,border:`1.5px solid ${checked?"#22c55e":t.color+"28"}`,fontSize:18}}>{checked?"✅":t.emoji}</div>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <span style={{fontWeight:700,fontSize:14,color:checked?"#16a34a":"#0f172a",textDecoration:checked?"line-through":"none",opacity:checked?.75:1}}>{w.day} · {t.label}</span>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          {w.km>0&&w.type!=="race"&&<span style={{fontWeight:800,fontSize:13,color:checked?"#16a34a":t.color}}>{w.km} km</span>}
                          {w.min>0&&<span style={{fontWeight:800,fontSize:13,color:checked?"#16a34a":t.color}}>{w.min} min</span>}
                          {canCheck&&<div style={{width:20,height:20,borderRadius:6,flexShrink:0,border:checked?"2px solid #22c55e":"2px solid #cbd5e1",background:checked?"#22c55e":"white",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,color:"white",fontWeight:900}}>{checked?"✓":""}</div>}
                        </div>
                      </div>
                      <div style={{fontSize:13,marginTop:3,lineHeight:1.5,color:checked?"#4ade80":"#475569",opacity:checked?.8:1}}>{w.desc}</div>
                    </div>
                  </div>
                );
              })}
            </div>

            <div style={{background:"white",borderRadius:12,padding:"14px 16px",marginBottom:8,display:"flex",gap:12,alignItems:"flex-start",boxShadow:"0 1px 3px rgba(0,0,0,.05)"}}>
              <div style={{fontSize:20,flexShrink:0}}>💡</div>
              <div><div style={{fontWeight:700,fontSize:13,color:"#0f172a",marginBottom:3}}>Veckans fokus</div><div style={{fontSize:13,color:"#475569",lineHeight:1.6}}>{week.tip}</div></div>
            </div>

            <div style={{display:"flex",flexWrap:"wrap",gap:5,paddingBottom:32,marginTop:8}}>
              {Object.entries(TYPES).filter(([k])=>!["rest","off"].includes(k)).map(([k,t])=>(
                <div key={k} style={{background:t.bg,borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:600,color:t.color,border:`1px solid ${t.color}25`}}>{t.emoji} {t.label}</div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* ── App shell ── */
    function App() {
      const [config,setConfig]=useState(null);
      const [checking,setChecking]=useState(true);
      const [showSettings,setShowSettings]=useState(false);

      useEffect(()=>{
        const token=localStorage.getItem("oppet-token");
        const gistId=localStorage.getItem("oppet-gist-id");
        if(token&&gistId) setConfig({token,gistId});
        setChecking(false);
      },[]);

      const handleComplete=cfg=>{ setConfig(cfg); setShowSettings(false); };

      if(checking) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",fontSize:14,color:"#94a3b8"}}>Laddar...</div>;
      if(!config||showSettings) return <SetupWizard onComplete={handleComplete} onCancel={config?()=>setShowSettings(false):null}/>;
      return <TrainingPlan config={config} onReset={()=>setShowSettings(true)}/>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
